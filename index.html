<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Airport Assistance</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #16213e, var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--panel);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 16px;
    padding: 48px;
    max-width: 560px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 20px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 28px;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 8px;
  }
  .plane {
    font-size: 40px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="plane">✈️</div>
    <div class="badge">Under Construction</div>
    <h1>Smart Airport Assistance</h1>
    <p>This site is live, but the project content hasn't been added yet.</p>
    <p>Replace this page with the real Smart Airport Assistance app to get started.</p>
  </div>
</body>
</html>
